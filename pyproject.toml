[project]
name = "signal-room"
version = "0.1.0"
description = "A synthetic conference-operations dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "plotly",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_room"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
